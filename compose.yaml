services:

  app:
    build: .
    container_name: laravel_app
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www
      - /var/www/node_modules
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: Multipe_agence_location
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - ./projetEnsi.sql:/docker-entrypoint-initdb.d/projetEnsi.sql
      - sail-pgsql:/var/lib/postgresql/data

networks:
  sail:
    driver: bridge

volumes:
  sail-pgsql:
    driver: local